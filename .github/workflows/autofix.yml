name: autofix.ci

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/checkout@v6
      - run: corepack enable
      - run: pnpm install
      - run: pnpm run lint --fix
      - uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8
